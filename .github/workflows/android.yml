name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "app/src/main/kotlin/**", "app/src/main/proto/**", "innertube/**", "shared/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "app/src/main/kotlin/**", "app/src/main/proto/**", "innertube/**", "shared/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable Utaloom APK and test APK
        run: bash gradlew :android:assembleDebug :android:assembleDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: utaloom-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
