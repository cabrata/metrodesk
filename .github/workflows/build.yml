name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb createDistributable
          - os: windows-latest
            task: packageMsi createDistributable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y vlc-bin vlc-plugin-base libvlc5
      - name: Install VLC and WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vlc wixtoolset --yes --no-progress
          Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Test
        shell: bash
        run: bash ./gradlew :shared:jvmTest :app:test :app:playerSmoke --no-daemon
      - name: Package
        shell: bash
        run: |
          for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" --no-daemon; done
      - uses: actions/upload-artifact@v4
        with:
          name: metrodesk-${{ runner.os }}
          path: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/app/**
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/msi/*.msi
