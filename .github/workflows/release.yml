name: Release

# Production release: push a tag like v1.2.3 (git tag v1.2.3 && git push origin v1.2.3).
# Builds installers with that version, then publishes a GitHub release the in-app update check sees.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb packageRpm
          - os: windows-latest
            task: packageMsi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        shell: bash
        run: |
          # MSI and deb need a plain MAJOR.MINOR.PATCH version.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Test
        shell: bash
        run: bash ./gradlew :shared:jvmTest :app:test --no-daemon
      - name: Package
        shell: bash
        run: for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" -PappVersion="$GITHUB_REF_NAME" --no-daemon; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          make_latest: true
