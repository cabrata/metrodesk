name: Release

# Automatic production release: bump appVersion in gradle.properties and push to main.
# If tag v<appVersion> doesn't exist yet, this builds deb/rpm/msi with that version and publishes
# a GitHub release (creating the tag), which the in-app update check picks up.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          # MSI and deb need a plain MAJOR.MINOR.PATCH version.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::appVersion must look like 1.2.3, got '$v'"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb packageReleaseRpm
          - os: windows-latest
            task: packageReleaseMsi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Test
        shell: bash
        run: bash ./gradlew :shared:jvmTest :app:test --no-daemon
      - name: Package
        shell: bash
        run: for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" --no-daemon; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            app/build/compose/binaries/main-release/deb/*.deb
            app/build/compose/binaries/main-release/rpm/*.rpm
            app/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Android signing key
        env:
          KEYSTORE: ${{ secrets.UTALOOM_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::UTALOOM_KEYSTORE secret is required for installable release APKs"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/utaloom-release.jks"
          chmod 600 "$RUNNER_TEMP/utaloom-release.jks"
      - name: Build signed Utaloom Android APK
        env:
          UTALOOM_KEYSTORE: ${{ runner.temp }}/utaloom-release.jks
          UTALOOM_KEYSTORE_PASSWORD: ${{ secrets.UTALOOM_KEYSTORE_PASSWORD }}
          UTALOOM_KEY_ALIAS: ${{ secrets.UTALOOM_KEY_ALIAS }}
          UTALOOM_KEY_PASSWORD: ${{ secrets.UTALOOM_KEY_PASSWORD }}
        run: |
          bash gradlew :android:assembleRelease --no-daemon --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/build/outputs/apk/release/android-release.apk
          mkdir -p dist
          cp android/build/outputs/apk/release/android-release.apk "dist/utaloom-${{ needs.version.outputs.tag }}-android.apk"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/utaloom-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [version, package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Utaloom ${{ needs.version.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          make_latest: true
